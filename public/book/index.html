<!DOCTYPE html>
<html lang="en">
<head>

<title>Mr. Tycoon — Pick Your Time</title>
<meta name="description" content="Step 2 of 2: pick a time for your strategy call with Mr. Tycoon.">
<!-- Step 2 of the strategy-call flow. Visitors land here from the GHL "Sprint Application" form's on-submit redirect;
     nobody should find it from a search engine. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050B18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 80'%3E%3Crect width='64' height='80' rx='16' fill='%23071022'/%3E%3Cg fill='none' stroke='%23E7EBF1' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M32 10v12M26 16h12M22 34c0-8 20-8 20 0 0 5-3 9-5 14H27c-2-5-5-9-5-14zM20 52h24M23 52l-3 12h24l-3-12M16 70h32'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Root-relative: this page lives one folder down from the site's assets. -->
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<!-- No preloader, no scroll scenes and no script of our own on this page, so the nav is shown (is-in) and
     nothing uses data-reveal — those only appear once main.js runs, and main.js is not loaded here. -->
<header class="nav is-in" id="nav">
  <a class="nav-brand" href="/">Mr. Tycoon</a>
</header>

<main>

<section id="book" class="section close book">
  <div class="wrap close-inner">
    <p class="eyebrow eyebrow-center">The Strategy Call</p>
    <h2 class="display close-title">Step 2 of 2. <em>Pick your time.</em></h2>

    <div class="cta-panel glass">
      <!-- GoHighLevel strategy-call calendar, moved here from the close section of the home page on 2026-10-23.
           The booking itself lives in GHL; to swap calendars, change the id in src and in the iframe id.
           Do NOT add loading="lazy": GHL's script parks the frame off-screen until it loads, and a lazy frame that is off-screen never loads. -->
      <!-- The wrapper carries the look (white card, see-through at rest). GHL's script writes its own
           opacity and position onto the iframe itself, so styling the iframe directly gets overridden. -->
      <div class="ghl-wrap">
        <iframe class="ghl-frame" id="hYeEOouYH3DB4AB20G8l_mrtycoon_site" title="Book a strategy call with Mr. Tycoon"
                src="https://api.leadconnectorhq.com/widget/booking/hYeEOouYH3DB4AB20G8l"
                scrolling="no"></iframe>
      </div>
      <!-- GHL's own script: reveals the calendar once it loads and sizes the frame to fit, so it is never cut off. -->
      <script src="https://link.msgsndr.com/js/form_embed.js" defer></script>
    </div>
  </div>
</section>

</main>

</body>
</html>
